name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Build and smoke-test the wheel against the demo server
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          mcp-auth-doctor --version
          python scripts/demo_server.py --port 8765 &
          python scripts/demo_server.py --port 8766 --broken &
          sleep 2
          mcp-auth-doctor http://127.0.0.1:8765/mcp --dcr-probe
          if mcp-auth-doctor http://127.0.0.1:8766/mcp --json > broken.json; then echo "expected exit 1"; exit 1; fi
          python -c "import json; d=json.load(open('broken.json')); assert d['summary']['exit_code']==1; assert any(c['id']=='prm-resource' and c['status']=='fail' for c in d['checks'])"

  container-build:
    name: Build the container image and run it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image, print --help and check the demo server from a second container
        run: |
          docker build --build-arg VERSION=ci -t mcp-auth-doctor:ci .
          docker run --rm mcp-auth-doctor:ci --help > help.txt && grep "^usage: mcp-auth-doctor" help.txt
          docker run --rm mcp-auth-doctor:ci --version
          test "$(docker run --rm --entrypoint id mcp-auth-doctor:ci -u)" = "1000"
          docker run -d --name demo -v "$PWD/scripts:/scripts:ro" --entrypoint python mcp-auth-doctor:ci /scripts/demo_server.py --port 8765
          docker run -d --name broken -v "$PWD/scripts:/scripts:ro" --entrypoint python mcp-auth-doctor:ci /scripts/demo_server.py --port 8766 --broken
          sleep 2
          docker run --rm --network container:demo mcp-auth-doctor:ci http://127.0.0.1:8765/mcp --dcr-probe
          set +e
          docker run --rm --network container:broken mcp-auth-doctor:ci http://127.0.0.1:8766/mcp --json > /dev/null
          test $? -eq 1
