# Publishes to PyPI with trusted publishing when a v* tag is pushed.
#
# One-time setup by the repository owner:
#   1. On PyPI, add a "pending publisher" for project mcp-auth-doctor with
#      owner basitalisandhu, repository mcp-auth-doctor, workflow release.yml,
#      environment pypi.
#   2. In this repository, create the "pypi" environment (Settings, Environments)
#      and optionally require a reviewer on it.
#   3. Bump the version in pyproject.toml, add the CHANGELOG entry, then
#      git tag v0.1.0 && git push --tags
#   4. Set the repository variable PYPI_PUBLISH to "true" (Settings, Secrets and
#      variables, Actions, Variables) once steps 1 and 2 are done.
#
# Off by default: every job below is skipped unless PYPI_PUBLISH is "true", so a tag
# push only runs publish-github-packages.yml (GHCR image and GitHub Release) until then.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub release
    needs: publish
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## / { if (found) exit; if (index($0, "[" ver "]") || index($0, " " ver " ") || index($0, " " ver "$")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release $GITHUB_REF_NAME" > notes.md; fi
      - name: Create release (or add the distributions if publish-github-packages.yml created it first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
