[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-auth-doctor"
version = "0.1.1"
description = "Diagnose OAuth discovery problems on remote MCP servers: 401 challenge, protected resource metadata, authorization server metadata, PKCE, registration, token endpoint, optional login."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Basit Ali" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "oauth",
  "oauth2",
  "oauth2.1",
  "pkce",
  "rfc9728",
  "rfc8414",
  "rfc8707",
  "rfc9207",
  "protected-resource-metadata",
  "authorization-server-metadata",
  "authorization",
  "diagnostics",
  "security-tools",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
mcp-auth-doctor = "mcp_auth_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/basitalisandhu/mcp-auth-doctor"
Repository = "https://github.com/basitalisandhu/mcp-auth-doctor"
Issues = "https://github.com/basitalisandhu/mcp-auth-doctor/issues"
Changelog = "https://github.com/basitalisandhu/mcp-auth-doctor/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_auth_doctor"]

[tool.hatch.build.targets.sdist]
include = [
  "src/mcp_auth_doctor/**",
  "tests/**",
  "scripts/**",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "respx>=0.21",
  "ruff>=0.5",
  "build>=1.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
